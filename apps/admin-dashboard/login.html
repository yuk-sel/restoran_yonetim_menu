<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Giriş | Sofra Yönetim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/admin.css">
<script>try{var t=localStorage.getItem("theme");if(t&&t!=="auto")document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>
<div class="login">
  <section class="login-art" aria-hidden="true">
    <div class="plates"></div>
    <div class="brand">
      <div class="brand-mark">S</div>
      <div><b>Sofra</b><small>Yönetim paneli</small></div>
    </div>
    <div>
      <p class="word">Sofra</p>
      <p>Siparişler, masalar ve mutfak tek ekranda. Masadan gelen her istek anında burada.</p>
    </div>
  </section>

  <main class="login-form">
    <form id="login-form" novalidate>
      <h1>Giriş yap</h1>
      <p class="lead">Restoran hesabınızla devam edin.</p>

      <p class="form-error" id="error-message" role="alert" hidden></p>

      <div class="field">
        <label for="email">E-posta</label>
        <input class="input" type="email" id="email" name="email" autocomplete="username" placeholder="ornek@restoran.com" required>
      </div>
      <div class="field">
        <label for="password">Şifre</label>
        <div class="pw-wrap">
          <input class="input" type="password" id="password" name="password" autocomplete="current-password" required>
          <button class="pw-toggle" type="button" id="pwToggle" aria-controls="password">Göster</button>
        </div>
      </div>

      <button class="btn primary lg" type="submit" id="submitBtn">Giriş yap</button>

      <div class="login-foot">
        Sunucu çalışmıyorsa paneli örnek verilerle inceleyebilirsiniz.<br>
        <button class="demo-link" type="button" id="demoBtn">Örnek verilerle göz at</button>
      </div>
    </form>
  </main>
</div>
<script src="assets/js/api.js"></script>
<script src="assets/js/login.js"></script>
</body>
</html>
