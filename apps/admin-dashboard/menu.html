<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Restoran Yönetim Paneli - Menü Yönetimi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <!-- Yan Menü / Sidebar -->
  <div id="sidebar-container"></div>
  <!-- Ana İçerik / Main -->
  <main class="main">
    <div class="topbar">
      <div>
        <h1>Menü Yönetimi</h1>
        <p>Restoran menüsünü, kategorileri ve ürün detaylarını düzenleyin</p>
      </div>
      <div class="actions">
        <a href="#kategori-ekle" class="btn">Kategori Ekle</a>
        <a href="#urun-ekle" class="btn btn-primary">+ Yeni Ürün Ekle</a>
      </div>
    </div>

    <!-- Kategori Filtreleri -->
    <div class="category-tabs">
      <button type="button" class="tab-btn active" id="tum-urunler-btn">Tüm Ürünler</button>
      <span id="kategori-tab-list"></span>
    </div>

    <!-- Menü Kartları Izgarası -->
    <div class="menu-grid">
    </div>

    <!-- Yeni Ürün Ekleme Formu -->
    <section id="urun-ekle" class="form-section">
      <h2>Yeni Ürün Ekle</h2>
      <form id="urun-form" onsubmit="return false;">
        <div class="form-grid">
          <div class="form-group">
            <label for="urun-adi">Ürün Adı</label>
            <input type="text" id="urun-adi" placeholder="Örn: Izgara Köfte">
          </div>
          <div class="form-group">
            <label for="urun-kategori">Kategori</label>
            <select id="urun-kategori">
              <option value="">Kategori Seçin</option>
            </select>
          </div>
          <div class="form-group">
            <label for="urun-fiyat">Fiyat (TL)</label>
            <input type="number" id="urun-fiyat" step="0.01" placeholder="0.00">
          </div>
          <div class="form-group">
            <label for="urun-resim">Görsel URL</label>
            <input type="text" id="urun-resim" placeholder="https://resim-url.com">
          </div>
          <div class="form-group full">
            <label for="urun-aciklama">Açıklama</label>
            <textarea id="urun-aciklama" rows="3" placeholder="Ürün malzemelerini ve detaylarını girin..."></textarea>
          </div>
        </div>
        <div class="form-actions">
          <button id= "urunEkleButon" button type="submit" class="btn btn-primary">Kaydet</button>
        </div>
      </form>
    </section>

    <!-- Yeni Kategori Ekleme Formu -->
    <section id="kategori-ekle" class="form-section">
      <h2>Yeni Kategori Ekle</h2>
      <form id="kategori-form" onsubmit="return false;">
        <div class="form-grid">
          <div class="form-group">
            <label for="kategori-adi">Kategori Adı</label>
            <input type="text" id="kategori-adi" placeholder="Örn: Çorbalar">
          </div>
          <div class="form-group">
            <label for="kategori-sira">Sıralama No</label>
            <input type="number" id="kategori-sira" placeholder="1">
          </div>
        </div>
        <div class="form-actions">
          <button id= "kategoriButon" button type="submit" class="btn">Kategori Oluştur</button>
        </div>
      </form>
    </section>

  </main>
</div>

<script src="assets/js/sidebar.js"></script>
<script src="assets/js/menu.js"></script>

</body>
</html>
