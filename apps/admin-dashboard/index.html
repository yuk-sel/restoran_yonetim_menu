*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);margin:0;letter-spacing:-.01em}

.app{display:grid;grid-template-columns:240px 1fr;min-height:100%}

/* Sidebar */
.side{background:var(--brand);color:var(--brand-ink);padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;height:100dvh}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:18px}
.brand b{font-family:var(--font-display);font-size:17px;display:block;line-height:1.1}
.brand small{opacity:.65;font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;background:none;border:0;padding:10px 12px;border-radius:9px;color:inherit;opacity:.78;text-align:left;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.07);opacity:1}
.nav button[aria-current="page"]{background:rgba(255,255,255,.13);opacity:1}
.nav svg{width:19px;height:19px;flex:none}
.nav .badge{margin-left:auto;background:var(--accent);color:var(--accent-ink);border-radius:99px;font-size:12px;font-weight:600;padding:0 8px;min-width:22px;text-align:center}
.side-foot{margin-top:auto;font-size:13px;display:flex;flex-direction:column;gap:10px;padding:0 8px}
.side-foot .user{display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--brand-2);display:grid;place-items:center;font-weight:600;font-size:13px}
.side-foot button{background:rgba(255,255,255,.08);border:0;border-radius:8px;padding:7px 10px;color:inherit;text-align:left}
.side-foot button:hover{background:rgba(255,255,255,.15)}

/* Main */
.main{padding:26px 32px 48px;min-width:0}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.topbar h1{font-size:28px;font-weight:700}
.topbar p{margin:2px 0 0;color:var(--muted)}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.live{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:6px 12px;border-radius:99px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--s-ready)}
.dot.pulse{animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--s-ready) 55%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:99px;font-weight:500;display:inline-flex;align-items:center;gap:7px}
.btn:hover{background:var(--surface-2)}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;align-items:center;padding:10px 12px;gap:8px;overflow-x:auto}
  .brand small,.side-foot,.brand b{display:none}
  .nav{flex-direction:row}
  .nav button{white-space:nowrap;padding:9px 12px}
  .main{padding:20px 16px 40px}
}

<body>

<div class="app">
  <!-- Yan Menü / Sidebar -->
  <div id="sidebar-container"></div>

  <!-- Ana İçerik / Main -->
  <main class="main">
    <div class="topbar">
      <div>
        <h1 id="title">Genel Bakış</h1>
        <p id="subtitle">Restoranın şu anki durumu</p>
      </div>
      <div class="actions">
        <span class="live">
          <span class="dot pulse" id="liveDot"></span>
          <span id="liveTxt">Canlı Bağlantı</span>
        </span>
        <button class="btn" id="soundBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;"><path d="M4 9v6h4l5 4V5L8 9zM17 9a4 4 0 0 1 0 6"/></svg>
          Ses açık
        </button>
      </div>
    </div>

    <!-- Sayfa içerikleri bu alana yüklenmektedir -->
    <div id="view">
      <!-- İçerik Alanı -->
    </div>
  </main>
</div>
<script src="assets/js/sidebar.js"></script>
<script src="assets/js/index.js"></script>



</body>
</html>
