<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sofra Yönetim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/admin.css">
<script>
  // Giriş yoksa giriş sayfasına; tema tercihini sayfa çizilmeden uygula
  if (!localStorage.getItem("token")) location.replace("login.html");
  try { var t = localStorage.getItem("theme"); if (t && t !== "auto") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="brand-mark">S</div>
      <div><b>Sofra</b><small>Yönetim paneli</small></div>
    </div>

    <nav class="nav" aria-label="Ana menü">
      <a href="#genel" data-view="genel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z"/></svg>
        <span class="lbl">Genel Bakış</span>
        <span class="badge" id="badge-calls" hidden></span>
      </a>
      <a href="#siparisler" data-view="siparisler">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2zM9 8h6M9 12h6"/></svg>
        <span class="lbl">Siparişler</span>
        <span class="badge" id="badge-orders" hidden></span>
      </a>
      <a href="#menu" data-view="menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        <span class="lbl">Menü</span>
      </a>
      <a href="#masalar" data-view="masalar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h3v3h-3zM20 14v3M14 20h3M20 20v1"/></svg>
        <span class="lbl">Masalar &amp; QR</span>
      </a>
      <a href="#mutfak" data-view="mutfak">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/></svg>
        <span class="lbl">Mutfak Ekranı</span>
      </a>
      <a href="#raporlar" data-view="raporlar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>
        <span class="lbl">Raporlar</span>
      </a>
    </nav>

    <div class="side-foot">
      <div class="user">
        <div class="avatar" id="avatar">?</div>
        <div><b id="userName"></b><span id="userRole"></span></div>
      </div>
      <button id="themeBtn" type="button">Tema: Otomatik</button>
      <button id="logoutBtn" type="button">Çıkış yap</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1 id="title">Genel Bakış</h1>
        <p id="subtitle"></p>
      </div>
      <div class="actions">
        <span class="live" id="live"><span class="dot pulse"></span><span id="liveTxt">Bağlanıyor…</span></span>
        <button class="btn" id="soundBtn" type="button" aria-pressed="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9zM17 9a4 4 0 0 1 0 6"/></svg>
          <span>Ses açık</span>
        </button>
        <span id="viewActions" class="actions"></span>
      </div>
    </div>

    <div class="banner" id="demoBanner" hidden>
      <div><b>Örnek veriler gösteriliyor.</b> Değişiklikler kaydedilmez. Gerçek verilerle çalışmak için sunucuyu açıp yeniden giriş yapın.</div>
    </div>

    <div id="view" aria-live="polite"></div>
  </main>
</div>

<div id="modalRoot"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script src="assets/js/vendor/qrcode.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/index.js"></script>
</body>
</html>
