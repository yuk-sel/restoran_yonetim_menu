<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F3D38">
<title>Sofra Menü</title>
<link rel="manifest" href="public/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- Yükleniyor ekranı -->
<div class="screen center" id="loadingScreen">
  <div class="brand-mark big">S</div>
  <p class="muted">Menü yükleniyor…</p>
</div>

<!-- Geçersiz QR ekranı -->
<div class="screen center" id="errorScreen" hidden>
  <div class="brand-mark big">S</div>
  <h1 class="err-title">Bu QR kodu tanınmadı</h1>
  <p class="muted err-text" id="errorText">Masanızdaki QR kodu tekrar okutun. Sorun sürerse garsonunuza haber verin.</p>
  <button class="btn primary" type="button" id="retryBtn">Tekrar dene</button>
</div>

<!-- Ana uygulama -->
<div class="app" id="app" hidden>
  <header class="top">
    <div class="top-row">
      <div class="brand">
        <div class="brand-mark">S</div>
        <b id="restaurantName">Sofra</b>
      </div>
      <button class="icon-btn" type="button" id="serviceBtn" aria-label="Garson çağır veya hesap iste">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span>Garson</span>
      </button>
    </div>

    <div class="table-card">
      <div class="table-num" id="tableNum">12</div>
      <div class="table-meta">
        <span class="muted-ink">Masanız</span>
        <strong id="tableSection">Teras</strong>
      </div>
      <button class="track-pill" type="button" id="trackPill" hidden>
        <span class="dot pulse"></span>
        <span id="trackPillTxt">Sipariş #1042</span>
      </button>
    </div>

    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="searchInput" placeholder="Menüde ara" autocomplete="off">
    </label>
  </header>

  <nav class="cats" id="cats" aria-label="Kategoriler">
    
  </nav>

  <main class="menu" id="menu"></main>

  <div class="cart-bar" id="cartBar" hidden>
    <button class="cart-btn" type="button" id="openCartBtn">
      <span class="cart-count" id="cartCount">0</span>
      <span>Sepeti gör</span>
      <span class="cart-total" id="cartBarTotal">₺0</span>
    </button>
  </div>
</div>

<!-- Alt sayfa (sheet) kabı: ürün, sepet, servis, takip -->
<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
  <div class="grab" aria-hidden="true"></div>
  <button class="sheet-close" type="button" id="sheetClose" aria-label="Kapat">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
  </button>
  <div class="sheet-body" id="sheetBody"></div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="assets/js/customer_menu.js"></script>
</body>
</html>
